# Dedicated browser origin for Dashboards when OpenSearch is remote. A 401 on
# this port cannot invalidate the HTTP Basic session used by the portal on 443.
server {
  listen 5601 ssl;
  include /etc/nginx/nginx_ssl_config.conf;
  include /etc/nginx/nginx_csp_framing.conf;

  # OpenSearch Dashboards normally serves a tiny JavaScript page here to capture
  # URL fragments before starting OpenID login. The Oculox portal links to the
  # Dashboards root without a fragment, so redirect directly and avoid leaving
  # users on a blank intermediary page if browser script execution is delayed.
  location = /dashboards/auth/openid/captureUrlFragment {
    return 302 /dashboards/auth/openid/login?redirectHash=false&nextUrl=$arg_nextUrl;
  }

  location /dashboards {
    proxy_pass http://dashboards;
    proxy_redirect off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Roles "";
    include /etc/nginx/nginx_proxy_forward_headers.conf;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  location = /favicon.ico {
    alias /usr/share/nginx/html/favicon.ico;
  }

  location = /world.geojson {
    proxy_pass http://dashboards-maps;
    proxy_redirect off;
    include /etc/nginx/nginx_proxy_forward_headers.conf;
  }
}
